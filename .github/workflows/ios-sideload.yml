name: iOS sideload (unsigned IPA)

# Builds an UNSIGNED iOS .ipa of dsh-go for sideloading; you sign it yourself
# (ESign / Feather / Sideloadly / AltStore). No Apple account, certificates or
# secrets needed on this side.
#
# IMPORTANT: upstream `main` has no iOS project at all (all native code is
# Kotlin). The iOS port lives on `feat/ios-foundation` (Swift Runner, all
# channels, in-process NodeMobile engine). This workflow builds *that branch* by
# default; override `source_ref` once iOS lands on main.
#
# Run: Actions -> "iOS sideload (unsigned IPA)" -> Run workflow.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch/tag/sha to build (iOS-capable)"
        required: false
        default: "feat/ios-foundation"
      prepare_engine:
        description: "Prepare the in-process Node engine (local-engine mode); needs network, ~2 min"
        type: boolean
        default: true
      full_engine:
        description: "Also build the iSH Linux guest + engine addons (full engine, +40-60 min, needs Homebrew)"
        type: boolean
        default: false
      strip_extensions:
        description: "Remove embedded app extensions (simpler/faster self-signing)"
        type: boolean
        default: true
      publish_release:
        description: "Publish the .ipa to the `ios` prerelease (stable download URL)"
        type: boolean
        default: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.7"
  FLUTTER_SHA256: "dd9da574c3168460550117eb0e8dd0313ae934fabf64a82a6d557fff5fd1422e"
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build unsigned IPA (macOS)
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          python3 --version
          cargo --version || echo "::warning::cargo missing (phone self-runner needs Rust)"
          git log -1 --oneline

      # Upstream pins this exact Flutter build by SHA; use their download, not
      # the marketplace action (the iOS branch's lockfile is resolved for it).
      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          set -euo pipefail
          archive="flutter_macos_arm64_${FLUTTER_VERSION}-stable.zip"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/$archive"
          echo "$FLUTTER_SHA256  $RUNNER_TEMP/$archive" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      # Optional: without it the app builds and only connects to remote hosts.
      - name: Prepare the in-process engine
        if: ${{ inputs.prepare_engine }}
        continue-on-error: true
        run: |
          set -o pipefail
          bash tooling/ios/prepare-engine.sh 2>&1 | tee "$RUNNER_TEMP/prepare-engine.log"
          test -f app/ios/Engine/.ready

      - name: Resolve dependencies
        run: |
          set -euo pipefail
          python3 app/tool/l10n_merge.py --no-gen
          cd app
          flutter --version
          flutter pub get --enforce-lockfile
          flutter gen-l10n

      # The Xcode "Run Script" phase builds the iSH Linux guest itself and needs
      # ld.lld + meson + ninja; upstream's engine job installs exactly these.
      - name: Install the iSH engine toolchain
        if: ${{ inputs.prepare_engine && inputs.full_engine }}
        run: |
          set -euo pipefail
          brew install llvm lld
          python3 -m venv "$RUNNER_TEMP/ish-tools"
          "$RUNNER_TEMP/ish-tools/bin/pip" install --quiet meson==1.7.2 ninja==1.11.1.4
          {
            echo "$RUNNER_TEMP/ish-tools/bin"
            echo "$(brew --prefix llvm)/bin"
            echo "$(brew --prefix lld)/bin"
          } >> "$GITHUB_PATH"

      - name: Build the iSH guest engine
        if: ${{ inputs.prepare_engine && inputs.full_engine }}
        run: |
          set -uo pipefail
          export PATH="$(brew --prefix lld)/bin:$(brew --prefix llvm)/bin:$RUNNER_TEMP/ish-tools/bin:$PATH"
          set -o pipefail
          bash tooling/ios/build-ish.sh iphoneos app/ios/Engine/build/iphoneos/guest 2>&1 | tee "$RUNNER_TEMP/build-ish.log"

      # With the engine prepared, `flutter build ios` is not the path upstream
      # uses: their engine job runs `xcodebuild archive` with signing disabled
      # (tooling/ios/check-archive.sh). That path embeds the engine frameworks
      # and produces the same Runner.app Flutter would. Fall back to a plain
      # remote-only Flutter build when anything above fails.
      - name: Build iOS (release, no codesign)
        id: build
        continue-on-error: true
        working-directory: app
        run: |
          set -uo pipefail
          VERSION="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml)"
          BUILD="$(date -u +%Y%m%d%H%M)"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP_BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "::notice::dsh-go $VERSION ($BUILD)"

          APP_PATH=""
          if [ -f ios/Engine/.ready ]; then
            echo "== engine prepared: xcodebuild archive path"
            flutter build ios --release --no-codesign --config-only >"$RUNNER_TEMP/config-only.log" 2>&1 \
              || { echo "::warning::config-only failed"; tail -20 "$RUNNER_TEMP/config-only.log"; }
            archive="$RUNNER_TEMP/Runner.xcarchive"
            rm -rf "$archive"
            set -o pipefail
            if xcodebuild archive \
                  -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
                  -destination 'generic/platform=iOS' -archivePath "$archive" \
                  CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
                  2>&1 | tee "$RUNNER_TEMP/xcodebuild-archive.log"; then
              [ -d "$archive/Products/Applications/Runner.app" ] && APP_PATH="$archive/Products/Applications/Runner.app"
            fi
            # check-archive.sh does exactly this: the archive is the app.
            if [ -n "$APP_PATH" ] && [ -d "$APP_PATH/Frameworks" ]; then
              echo "::notice::archive produced $APP_PATH"
            else
              echo "::warning::engine archive build failed; falling back to a remote-only build"
              APP_PATH=""
            fi
          fi

          if [ -z "$APP_PATH" ]; then
            rm -rf ios/Engine
            bash ../tooling/ios/build.sh --release --no-codesign \
              --build-name "$VERSION" --build-number "$BUILD" 2>&1 | tee "$RUNNER_TEMP/flutter-build.log"
            APP_PATH="build/ios/iphoneos/Runner.app"
          fi

          test -d "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Package unsigned IPA
        working-directory: app
        run: |
          set -euo pipefail
          APP="${APP_PATH:-build/ios/iphoneos/Runner.app}"
          test -d "$APP"
          echo "packaging $APP"
          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa/Payload
          cp -R "$APP" build/ios/ipa/Payload/Runner.app

          if [ "${{ inputs.strip_extensions }}" = "true" ] && [ -d build/ios/ipa/Payload/Runner.app/PlugIns ]; then
            echo "removing embedded extensions: $(ls build/ios/ipa/Payload/Runner.app/PlugIns)"
            rm -rf build/ios/ipa/Payload/Runner.app/PlugIns
          fi
          find build/ios/ipa/Payload -name 'kernel_blob.bin' -print -exec rm -f {} +

          # The archive only exists when the iSH toolchain was installed; tell
          # the two packages apart instead of clobbering the small one.
          ENGINE=no
          [ -d "build/ios/ipa/Payload/Runner.app/Frameworks/DshNodeHost.framework" ] && ENGINE=yes
          ASSET_NAME="dsh-go-ios-unsigned.ipa"
          [ "$ENGINE" = "yes" ] && ASSET_NAME="dsh-go-ios-unsigned-full.ipa"
          echo "ENGINE_INCLUDED=$ENGINE" >> "$GITHUB_ENV"
          echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"

          (
            cd build/ios/ipa
            /usr/bin/ditto -c -k --keepParent Payload "unsigned.ipa"
          )
          mv build/ios/ipa/unsigned.ipa "build/ios/ipa/dsh-go-${APP_VERSION}-ios-unsigned.ipa"
          cp "build/ios/ipa/dsh-go-${APP_VERSION}-ios-unsigned.ipa" "build/ios/ipa/$ASSET_NAME"

          plutil -lint build/ios/ipa/Payload/Runner.app/Info.plist
          echo "bundle id: $(plutil -extract CFBundleIdentifier raw build/ios/ipa/Payload/Runner.app/Info.plist)"
          echo "version:   $(plutil -extract CFBundleShortVersionString raw build/ios/ipa/Payload/Runner.app/Info.plist)"
          echo "build:     $(plutil -extract CFBundleVersion raw build/ios/ipa/Payload/Runner.app/Info.plist)"
          echo "min iOS:   $(plutil -extract MinimumOSVersion raw build/ios/ipa/Payload/Runner.app/Frameworks/App.framework/Info.plist 2>/dev/null || true)"
          lipo -info build/ios/ipa/Payload/Runner.app/Runner
          echo "--- Frameworks:"
          ls build/ios/ipa/Payload/Runner.app/Frameworks | head -40
          ls -lh build/ios/ipa/*.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-go-ios-unsigned
          path: app/build/ios/ipa/*.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Keep the build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: |
            ${{ runner.temp }}/flutter-build.log
            ${{ runner.temp }}/config-only.log
            ${{ runner.temp }}/xcodebuild-archive.log
            ${{ runner.temp }}/build-ish.log
            ${{ runner.temp }}/prepare-engine.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish unsigned IPA to the ios prerelease
        if: ${{ inputs.publish_release }}
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET="build/ios/ipa/${ASSET_NAME}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/ios/${ASSET_NAME}"
          NOTES="未签名 iOS IPA（自签侧载），构建自 \`${{ inputs.source_ref }}\`（提交 $(git -C .. rev-parse --short HEAD)）。
          本机引擎：${ENGINE_INCLUDED}（yes = 可在手机上直接跑 DSH；no = 只能连远程主机）。
          用 ESign / Feather / Sideloadly / AltStore 自签安装；详见 docs/ios-sideload.md。"

          if gh release view ios --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit ios --repo "$GITHUB_REPOSITORY" \
              --title "iOS sideload build ${APP_VERSION} (${GITHUB_SHA::7})" --notes "$NOTES" --prerelease
            gh release upload ios "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create ios "$ASSET" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "iOS sideload build ${APP_VERSION} (${GITHUB_SHA::7})" \
              --notes "$NOTES" --prerelease
          fi

          {
            echo "## iOS 未签名 IPA"
            echo ""
            echo "- 下载：$URL"
            echo "- 版本：${APP_VERSION} (${APP_BUILD})"
            echo "- 本机引擎：${ENGINE_INCLUDED}"
            echo "- 分支：${{ inputs.source_ref }}"
          } >> "$GITHUB_STEP_SUMMARY"
